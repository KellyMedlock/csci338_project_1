<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="brickStyles.css">
        <script src="brickbreakerMain.js" defer></script>
        <script src="brickbreakerData.js" defer></script>

        <title>Brick Break</title>
    </head>

    <body>
        <header>
            <div class="logo"><a href="../index.html"><h1>Ludos Games</h1></a></div>
        </header>

        <main class="gameContainer">
            <div class="startScreen">
                <h1>Brick Break</h1>
                <label for="playerName">Enter your player name</label>
                <input type="text" class="playerName" placeholder="Your Name">
                <button class="startButton">Start Game</button>
            </div>

            <div class="gameScreen" style="display: none;">
                <canvas class="canvas"></canvas>
                <canvas class="canvas1"></canvas>
                <div style="display: inline;">
                    <h1 style="text-align: center;" class="currentScore">YOUR SCORE:</h1>
                    <h1 style="text-align: center;" class="highScore">HIGH SCORE:</h1>
                </div>
            </div>
        </main>
    </body>
</html>
