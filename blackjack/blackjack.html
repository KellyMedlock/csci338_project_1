<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack Page</title>
    <link rel="stylesheet" href="blackjack.css">
    <script src="blackjack.js"></script>
</head>
<body>
    <header>
            <div class="logo">
                <h1>
                    <a href="../index.html" class="go-Back">Ludos Games</a>
                </h1>
            </div>
    </header>
    <div class="game-box">
        <h2>Dealer: <span id="dealer-sum"></span></h2>
        <div id="dealer-hand"></div>
        <h2>You: <span id="player-sum"></span></h2>
        <div id="player-hand"></div>
        <p class="sum" id="player-hand-current-sum">Your current total is: </p>
    </div>
    <div id="game-popup" class="popup hidden">
        <div class="popup-content">
            <h2 id="popup-title">Game Over</h2>
            <p id="results"></p>
        <button class="button" id="new-game">New game</button>
        </div>
    </div>

    <div class="buttons">
        <button class="button" id="hit">Hit</button>
        <button class="button" id="stay">Stay</button>
    </div>
</body>
</html>
