<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Jack Page</title>
    <link rel="stylesheet" href="blackjack.css">
    <script src="blackjack.js"></script>
</head>
<body>
    <h2>Dealer: <span id="dealer-sum"></span></h2>
    <div id="dealer-hand"></div>
    <h2>You: <span id="player-sum"></span></h2>
    <div id="player-hand"></div>
    <p>Your current total is:</p>
    <p id="player-hand-current-sum"></p>
    <br>
    <button class="button" id="hit">Hit</button>
    <button class="button" id="stay">Stay</button>
    <button class="button" id="new-game">New game</button>
    <p id ="results"></p>
</body>
</html>
